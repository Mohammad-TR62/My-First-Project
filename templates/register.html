<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ثبت نام</title>
    <style>
        body {
            background-color: #f0f0f0;
            font-family: Tahoma, Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        form {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
        }
        input {
            padding: 5px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #008CBA;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #007B9E;
        }
    </style>
</head>
<body>

    <h1>ثبت نام کاربر جدید</h1>
    
    <form action="/register" method="POST">
        <label>نام کاربری:</label><br>
        <input type="text" name="username" placeholder="یک نام کاربری انتخاب کنید" required><br><br>

        <label>رمز عبور:</label><br>
        <input type="password" name="password" required><br><br>

        <button type="submit">ثبت نام</button>
    </form>
    
    <br>
    <a href="/">بازگشت به صفحه ورود</a>

</body>
</html>
